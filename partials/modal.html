<!-- Модальное окно -->
<div class="modal" id="modal">
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__content">
        <button class="modal__close" data-modal-close>×</button>
        
        <div class="modal__body" id="modal-body">
            <h3>Подобрать оборудование</h3>
            <p>Оставьте контакты — мы перезвоним и ответим на все вопросы</p>
            <form id="callback-form">
                <input type="text" name="name" placeholder="Ваше имя" required>
                <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required>
                <input type="malito" name="email" placeholder="email (необязательно)">
                
                <div class="form-checkbox">
                    <input type="checkbox" id="consent" checked required>
                    <label for="consent">Я согласен на <a href="/legal/consent.html" target="_blank">обработку персональных данных</a></label>
                </div>
                <button type="submit" class="btn btn--primary btn--full">Отправить</button>
            </form>
        </div>

        <div class="modal__body modal__success" id="modal-success" style="display: none;">
            <div class="success-icon">✓</div>
            <h3>Спасибо!</h3>
            <p>Мы свяжемся с вами в ближайшее время.</p>
            <button class="btn btn--primary" data-modal-close>Закрыть</button>
        </div>

    </div>
</div>
